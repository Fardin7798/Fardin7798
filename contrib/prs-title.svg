<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes left{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@keyframes flash{0%,99%{opacity:1}100%{opacity:0}}@keyframes stay{to{opacity:1}}.fx{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx,.fin{opacity:1!important}.num{display:none}}</style><g class="fx" style="animation:up 0.6s ease-out 0.00s 1 both"><rect width="1000" height="56" rx="8" fill="#0d1117"/><text x="4" y="38" font-size="22" fill="#e6edf3" font-weight="700" text-anchor="start">Recent pull requests</text><text x="996" y="38" font-size="13" fill="#8b949e" font-weight="400" text-anchor="end">11 total</text></g></svg>