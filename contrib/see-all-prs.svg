<svg xmlns="http://www.w3.org/2000/svg" width="248" height="36" viewBox="0 0 248 36" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes left{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@keyframes flash{0%,99%{opacity:1}100%{opacity:0}}@keyframes stay{to{opacity:1}}.fx{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx,.fin{opacity:1!important}.num{display:none}}</style><g class="fx" style="animation:up 0.6s ease-out 0.20s 1 both"><rect x="0.5" y="0.5" width="247" height="35" rx="8" fill="#161b22" stroke="#30363d"/><text x="20" y="23" font-size="13" fill="#58a6ff" font-weight="700" text-anchor="start">See all 11 pull requests</text><g class="fx" style="animation:nudge 1.4s ease-in-out 1.00s infinite none"><text x="226" y="23" font-size="14" fill="#58a6ff" font-weight="700" text-anchor="end">→</text></g></g></svg>