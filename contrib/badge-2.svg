<svg xmlns="http://www.w3.org/2000/svg" width="99" height="28" viewBox="0 0 99 28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes left{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@keyframes flash{0%,99%{opacity:1}100%{opacity:0}}@keyframes stay{to{opacity:1}}.fx{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx,.fin{opacity:1!important}.num{display:none}}</style><g class="fx" style="animation:pop 0.6s ease-out 0.24s 1 both"><clipPath id="r"><rect width="99" height="28" rx="4"/></clipPath><g clip-path="url(#r)"><rect width="67.0" height="28" fill="#555"/><rect x="67.0" width="32.6" height="28" fill="#58a6ff"/></g><text x="33.5" y="19" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">REPOS</text><text class="num" style="opacity:0;animation:flash 0.090s linear 0.590s 1 forwards" x="83.3" y="19" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">0</text><text class="num" style="opacity:0;animation:flash 0.090s linear 0.680s 1 forwards" x="83.3" y="19" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">1</text><text class="num" style="opacity:0;animation:flash 0.090s linear 0.770s 1 forwards" x="83.3" y="19" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">2</text><text class="num" style="opacity:0;animation:flash 0.090s linear 0.860s 1 forwards" x="83.3" y="19" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">3</text><text class="num" style="opacity:0;animation:flash 0.090s linear 0.950s 1 forwards" x="83.3" y="19