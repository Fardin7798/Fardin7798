<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="48" viewBox="0 0 1000 48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><style>@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes left{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}@keyframes flash{0%,99%{opacity:1}100%{opacity:0}}@keyframes stay{to{opacity:1}}.fx{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx,.fin{opacity:1!important}.num{display:none}}</style><g class="fx" style="animation:left 0.6s ease-out 0.08s 1 both"><rect x="0.5" y="0.5" width="999" height="47" rx="8" fill="#161b22" stroke="#30363d"/><g class="fx" style="animation:pulse 1.8s ease-in-out 0.88s infinite none"><text x="18" y="30" font-size="13" fill="#3fb950" font-weight="700" text-anchor="start">●</text></g><text x="36" y="30" font-size="13" fill="#3fb950" font-weight="700" text-anchor="start">Open</text><text x="140" y="30" font-size="13" fill="#58a6ff" font-weight="400" text-anchor="start">fix(action-bar): enhance a11y for action-bar stories</text><text x="610" y="30" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">yamada-ui/yamada-ui</text><text x="982" y="30" font-size="12" fill="#8b949e" font-weight="400" text-anchor="end">3 Nov 2026</text></g></svg>